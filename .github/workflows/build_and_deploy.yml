name: Build report and deploy site

# Compiles document/main.tex to site/report.pdf and deploys the site via GitHub Pages

on:
  push:
    branches: [main, stateful]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release uploads (tags only)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: document

      - name: Place PDF into the site
        run: cp document/main.pdf site/report.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # whole repo, preserving the /site/... URL structure

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Attach report to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: site/report.pdf
